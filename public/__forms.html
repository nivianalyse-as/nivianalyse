<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Skjemadefinisjon – NIVI Analyse</title>
</head>
<body>
  <!-- Authoritative Netlify Forms definition for the "kontakt" form.
       Netlify detects this static file at deploy time; ContactForm.tsx posts here. -->
  <form name="kontakt" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="kontakt" />
    <input type="text" name="bot-field" />
    <input type="text" name="navn" />
    <input type="email" name="epost" />
    <input type="tel" name="telefon" />
    <input type="text" name="organisasjon" />
    <input type="text" name="tema" />
    <textarea name="melding"></textarea>
  </form>
</body>
</html>
