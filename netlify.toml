## Noindex på PDF-er under /publikasjoner/ (arkivsider forblir indekserbare)
[[headers]]
  for = "/publikasjoner/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

## Spam query-URL-er (?s=, ?option=, ?format=) — returner 410 Gone
[[redirects]]
  from = "/*"
  query = {s = ":any"}
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  query = {option = ":any"}
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  query = {format = ":any"}
  to = "/410.html"
  status = 410
  force = true

## Gamle WordPress-URL-er — returner 410 Gone (må stå FØR SPA fallback)
[[redirects]]
  from = "/wp-content/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
