## Gamle WordPress-URL-er — returner 410 Gone (må stå FØR SPA fallback)
[[redirects]]
  from = "/wp-content/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/index.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/category/*"
  to = "/410.html"
  status = 410
  force = true

